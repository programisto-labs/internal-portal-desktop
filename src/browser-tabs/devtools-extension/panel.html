<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="panel.css">
</head>
<body>
<main>
  <header class="bar">
    <button id="toggle" class="toggle" type="button" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="5" width="13" height="11" rx="1.5"/><rect x="17" y="8" width="5" height="11" rx="1"/><path d="M6 20h7"/></svg>
      <span id="toggle-label"></span>
    </button>
    <label class="field">
      <span data-i18n="device"></span>
      <select id="device"></select>
    </label>
    <div class="size">
      <input id="width" type="number" min="50" max="4000" inputmode="numeric" aria-label="width">
      <span class="times">×</span>
      <input id="height" type="number" min="50" max="4000" inputmode="numeric" aria-label="height">
      <button id="rotate" class="icon" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"/><path d="M3 21v-5h5"/></svg>
      </button>
    </div>
    <label class="field">
      <span data-i18n="type"></span>
      <select id="mobile">
        <option value="1" data-i18n="mobile"></option>
        <option value="0" data-i18n="desktop"></option>
      </select>
    </label>
    <label class="field">
      <span data-i18n="dpr"></span>
      <select id="dpr"></select>
    </label>
    <label class="field">
      <span data-i18n="zoom"></span>
      <select id="zoom"></select>
    </label>
  </header>
  <p id="status" class="status" role="status"></p>
  <p class="hint" data-i18n="hint"></p>
</main>
<script src="panel.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src file:">
  <title>Erreur</title>
  <style>
    :root { color-scheme: light dark; --fg: #1d1d1f; --muted: #6e6e73; --bg: #ffffff; --accent: #1d1d1f; --accent-fg: #ffffff; --danger: #c62828; --code: #f2f2f4; }
    @media (prefers-color-scheme: dark) {
      :root { --fg: #f5f5f7; --muted: #a1a1a6; --bg: #161616; --accent: #f5f5f7; --accent-fg: #161616; --danger: #ef5350; --code: #242426; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg); color: var(--fg); padding: 32px;
    }
    main { max-width: 520px; width: 100%; }
    .icon { font-size: 40px; line-height: 1; margin-bottom: 20px; }
    h1 { font-size: 22px; font-weight: 600; margin: 0 0 12px; }
    body[data-kind="certificate"] h1 { color: var(--danger); }
    p { margin: 0 0 12px; color: var(--muted); font-size: 14px; line-height: 1.5; }
    .host { color: var(--fg); font-weight: 600; word-break: break-all; }
    code { display: inline-block; margin-top: 4px; padding: 2px 6px; border-radius: 6px; background: var(--code); font-size: 12px; color: var(--muted); }
    .actions { display: flex; gap: 8px; margin-top: 24px; }
    .button {
      display: inline-flex; align-items: center; height: 34px; padding: 0 16px; border-radius: 999px;
      font-size: 13px; font-weight: 500; text-decoration: none; cursor: pointer; border: 1px solid transparent;
      background: var(--accent); color: var(--accent-fg); font-family: inherit;
    }
    .button.secondary { background: transparent; color: var(--fg); border-color: color-mix(in srgb, var(--fg) 20%, transparent); }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <div class="icon" id="icon" aria-hidden="true"></div>
    <h1 id="title"></h1>
    <p id="message"></p>
    <p id="detail"></p>
    <p><code id="code" hidden></code></p>
    <div class="actions">
      <a class="button" id="retry" hidden></a>
      <button class="button secondary" type="button" id="back" hidden>Revenir en arrière</button>
    </div>
  </main>
  <script src="tab-error.js"></script>
</body>
</html>

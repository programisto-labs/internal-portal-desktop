<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; script-src 'none'">
<title>Coffre Lasco</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: rgba(255, 255, 255, 0.96);
    --fg: #111;
    --muted: rgba(0, 0, 0, 0.55);
    --edge: rgba(0, 0, 0, 0.1);
    --hover: rgba(0, 0, 0, 0.06);
    --icon-bg: rgba(0, 0, 0, 0.05);
  }
  :root[data-theme='dark'] {
    --bg: rgba(28, 28, 28, 0.96);
    --fg: #f2f2f2;
    --muted: rgba(255, 255, 255, 0.58);
    --edge: rgba(255, 255, 255, 0.12);
    --hover: rgba(255, 255, 255, 0.08);
    --icon-bg: rgba(255, 255, 255, 0.07);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; }
  body {
    font: 13px/1.35 -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    color: var(--fg);
    -webkit-user-select: none;
    user-select: none;
    overflow: hidden;
  }
  .panel {
    border: 1px solid var(--edge);
    border-radius: 14px;
    background: var(--bg);
    padding: 6px;
    -webkit-backdrop-filter: blur(24px);
    backdrop-filter: blur(24px);
  }
  .head {
    display: flex; align-items: center; gap: 6px;
    padding: 4px 8px 6px; font-size: 11px; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .head b { font-weight: 600; color: var(--fg); }
  .list { max-height: 264px; overflow-y: auto; }
  .row {
    display: flex; align-items: center; gap: 10px; width: 100%;
    border: 0; background: transparent; color: inherit; font: inherit; text-align: left;
    border-radius: 10px; padding: 6px 8px; cursor: default; min-height: 44px;
  }
  .row.action { min-height: 34px; padding: 6px 8px; color: var(--fg); }
  .row.active, .row:hover { background: var(--hover); }
  .row:focus { outline: none; }
  .icon {
    flex: none; width: 28px; height: 28px; border-radius: 999px; background: var(--icon-bg);
    display: grid; place-items: center; color: var(--muted);
  }
  .action .icon { background: transparent; width: 28px; height: 20px; }
  .icon svg { width: 15px; height: 15px; }
  .text { min-width: 0; flex: 1; }
  .label, .sub { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .label { font-weight: 500; }
  .sub { font-size: 11px; color: var(--muted); }
  .empty { padding: 6px 8px 8px; color: var(--muted); font-size: 12px; }
  .sep { height: 1px; background: var(--edge); margin: 4px 2px; }
</style>
</head>
<body>
  <div class="panel" id="panel" role="listbox" aria-labelledby="head">
    <div class="head" id="head"></div>
    <div class="list" id="list"></div>
    <div class="sep"></div>
    <div id="actions"></div>
  </div>
</body>
</html>

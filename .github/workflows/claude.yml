name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned, labeled]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude') || (github.event.action == 'labeled' && github.event.label.name == 'claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          branch_prefix: claude/
          claude_args: |
            --max-turns 80
            --allowedTools "Bash(npm run *),Bash(npm ci *),Bash(npx *),Bash(node *),Bash(git *),Bash(gh pr *),Bash(gh issue *),Edit,Write,Read,Glob,Grep"
            --append-system-prompt "Tu travailles sur l'app desktop Electron de Lasco (src/main.js, src/preload.js, src/browser-tabs/). Le front web est dans le repo programisto-labs/internal-portal (apps/frontend) : si un ticket nécessite aussi des changements côté web, implémente uniquement la partie desktop ici et décris précisément dans la PR ce qu'il faut côté web. Règles : 1) Travaille sur une branche de feature créée depuis main. 2) Ouvre une PR vers main mais ne merge jamais et n'active jamais l'auto-merge. 3) Avant chaque push, lance npm run test:unit et ajoute des tests node --test pour la logique ajoutée. 4) Reste générique SaaS : aucun nom de client, de personne ou d'email. 5) Ne touche jamais aux secrets, à la signature ni aux workflows de release."

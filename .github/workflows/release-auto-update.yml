name: Release Lasco (desktop)

# Normally called by release-please.yml once the release PR is merged (tag and draft release already exist).
# A tag pushed by hand (v*) or a manual run on an existing tag still publish.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (e.g. v2.11.0)"
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: "Tag to build and publish (e.g. v2.11.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  publish-macos:
    name: Publish macOS artifacts
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      # electron-builder names the release after package.json: it must match the tag.
      - name: Check package version matches the tag
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$RELEASE_TAG" ]; then
            echo "::error::package.json is $version but the tag is $RELEASE_TAG."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Auto-update (ShipIt) only installs an app signed by the same Developer ID as the installed one,
      # and a first install from the DMG needs Apple notarization. Never publish a macOS build without both.
      - name: Check signing and notarization secrets
        env:
          CSC_LINK: ${{ secrets.MAC_CERTS }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=""
          [ -n "$CSC_LINK" ] || missing="$missing MAC_CERTS"
          [ -n "$CSC_KEY_PASSWORD" ] || missing="$missing MAC_CERTS_PASSWORD"
          [ -n "$APPLE_ID" ] || missing="$missing APPLE_ID"
          [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] || missing="$missing APPLE_APP_SPECIFIC_PASSWORD"
          [ -n "$APPLE_TEAM_ID" ] || missing="$missing APPLE_TEAM_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. The macOS release would be unsigned or not notarized; aborting."
            exit 1
          fi

      # electron-builder 25 cannot unlock the temporary keychain it creates from CSC_LINK on the macos-26
      # runner ("SecKeychainUnlock: The user name or passphrase you entered is not correct", v2.1.0).
      # Import the Developer ID certificate into our own keychain and point electron-builder at it.
      - name: Import signing certificate
        env:
          MAC_CERTS: ${{ secrets.MAC_CERTS }}
          MAC_CERTS_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/lasco-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          cert="$RUNNER_TEMP/lasco-signing.p12"
          echo "$MAC_CERTS" | base64 --decode > "$cert"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$cert" -k "$keychain" -P "$MAC_CERTS_PASSWORD" -f pkcs12 -A \
            -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$cert"
          security find-identity -v -p codesigning "$keychain" | grep -q "Developer ID Application" \
            || { echo "::error::No Developer ID Application identity in MAC_CERTS."; exit 1; }
          echo "CSC_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Build and publish macOS release
        env:
          # Prefer repo secret if set; otherwise use the Actions token (contents: write).
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          # Signing identity comes from the keychain imported above (CSC_KEYCHAIN); no CSC_LINK here,
          # otherwise electron-builder would create its own temporary keychain again.
          CSC_IDENTITY_AUTO_DISCOVERY: "true"
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # publish:mac sets forceCodeSigning: the build fails instead of shipping an unsigned app.
        run: npm run publish:mac

      - name: Verify the published app is signed and notarized
        run: |
          set -euo pipefail
          # Apple Silicon (dist/mac-arm64) and Intel (dist/mac) builds.
          for app in "dist/mac-arm64/Lasco.app" "dist/mac/Lasco.app"; do
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign -dv "$app" 2>&1 | grep -q "TeamIdentifier=${{ secrets.APPLE_TEAM_ID }}"
            spctl --assess --type execute --verbose=2 "$app"
            xcrun stapler validate "$app"
          done
          # Running apps pick their architecture's zip from latest-mac.yml: both must be listed.
          grep -q -- "-arm64-mac.zip" dist/latest-mac.yml
          grep -E -q -- "-[0-9.]+-mac.zip" dist/latest-mac.yml

      - name: Delete signing keychain
        if: always()
        run: |
          if [ -n "${CSC_KEYCHAIN:-}" ]; then security delete-keychain "$CSC_KEYCHAIN" || true; fi

  publish-windows:
    name: Publish Windows artifacts
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      # electron-builder names the release after package.json: it must match the tag.
      - name: Check package version matches the tag
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$RELEASE_TAG" ]; then
            echo "::error::package.json is $version but the tag is $RELEASE_TAG."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and publish Windows release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
        run: npm run publish:win

  # Linux : AppImage (mises à jour automatiques) et .deb, installé dans l'image de l'ordinateur Lasco (mode --vm,
  # docs/vm-mode.md). L'empreinte SHA-256 du .deb est publiée à côté : l'image la vérifie (LASCO_DESKTOP_DEB_SHA256).
  publish-linux:
    name: Publish Linux artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      # electron-builder names the release after package.json: it must match the tag.
      - name: Check package version matches the tag
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$RELEASE_TAG" ]; then
            echo "::error::package.json is $version but the tag is $RELEASE_TAG."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and publish Linux release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
        run: npm run publish:linux

      - name: Publish the SHA-256 of the .deb
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          deb=$(ls *.deb | head -n1)
          sha256sum "$deb" > "$deb.sha256"
          cat "$deb.sha256"
          gh release upload "$RELEASE_TAG" "$deb.sha256" --clobber --repo "$GITHUB_REPOSITORY"

  # Make the release public only once every platform is uploaded (electron-updater reads latest-mac.yml,
  # latest.yml and latest-linux.yml from the latest release). electron-builder only warns when it cannot
  # upload to an existing release, so check the assets here instead of trusting the build steps.
  finalize:
    name: Publish the release
    needs: [publish-macos, publish-windows, publish-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Check assets and publish the release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
        run: |
          set -euo pipefail
          assets="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          for name in latest-mac.yml latest.yml latest-linux.yml; do
            grep -qx "$name" <<<"$assets" || { echo "::error::$name missing from release $RELEASE_TAG."; exit 1; }
          done
          grep -q -- "-arm64-mac\.zip$" <<<"$assets" || { echo "::error::Apple Silicon zip missing."; exit 1; }
          grep -q -- "\.exe$" <<<"$assets" || { echo "::error::Windows installer missing."; exit 1; }
          grep -q -- "\.deb\.sha256$" <<<"$assets" || { echo "::error::.deb checksum missing."; exit 1; }
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
